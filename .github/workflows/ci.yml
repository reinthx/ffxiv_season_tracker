name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build # also stamps docs/data/version.json for the version test
      - run: npx playwright test

  deploy:
    needs: e2e
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: versions
        run: echo "wrangler=$(node -p "require('./package.json').devDependencies.wrangler.replace(/^[^\d]*/, '')")" >> "$GITHUB_OUTPUT"
      - run: npx wrangler d1 migrations apply ffxiv-tracker-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Requires repo secrets:
      #   CLOUDFLARE_API_TOKEN  (Account: Workers Scripts + D1, Edit)
      #   CLOUDFLARE_ACCOUNT_ID
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.versions.outputs.wrangler }}
          command: deploy
